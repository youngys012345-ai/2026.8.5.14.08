# 数据集与上游资源机器可读清单（供脚本与人工对照）
# 体积为量级估计，下载前请用 scripts/check_disk.py 核对空闲空间

tiers:
  S0_minimal:
    description: 最小跑通（特征优先）
    estimated_gb: [15, 40]
    free_space_recommend_gb: 50
    items: [gtea_features, egoper_features]
  S1_main_prototype:
    description: 主三集原型（仍优先特征，EgoProceL 不下全源视频）
    estimated_gb: [40, 80]
    free_space_recommend_gb: 120
    items: [gtea_features, egoper_features, egoprocel_features]
  S2_raw_videos:
    description: 含原始视频（建议内网大盘）
    estimated_gb: [150, 350]
    free_space_recommend_gb: 400
    items: [egoper_rgb, egoprocel_source_videos]
  S3_assembly101_full:
    description: Assembly101 全量多视角（外网机禁止）
    estimated_gb: [3890, 3890]
    free_space_recommend_gb: 4500
    items: [assembly101_full]
  S4_industreal_optional:
    description: IndustReal 可选，第一轮跳过
    estimated_gb: [5, 77]
    free_space_recommend_gb: 100
    items: [industreal]

datasets:
  gtea_features:
    role: primary_A
    form: i3d_features
    size_gb_est: [1, 5]
    note: Zenodo MS-TCN 三件套约 30GB（含 50Salads/Breakfast）；可只留 GTEA
    urls:
      - https://zenodo.org/records/3625992
      - https://github.com/Yuhan-Shen/ProTAS
  egoper_features:
    role: primary_A_B
    form: preextracted_features
    size_gb_est: [5, 20]
    hours: 28
    note: 需邮件申请；优先特征，勿先下全多模态
    urls:
      - https://github.com/robert80203/EgoPER_official
      - https://www.khoury.northeastern.edu/home/eelhami/egoper.htm
    request_email: lee.shih@northeastern.edu
  egoper_rgb:
    role: primary_B_optional
    form: rgb_videos
    size_gb_est: [30, 60]
    note: 720p@15fps 约 28 小时；多模态可达 80–150+ GB
  egoprocel_features:
    role: primary_A
    form: features_or_subset
    size_gb_est: [10, 40]
    hours: 62
    note: 全源视频 100–250+ GB，外网禁止全下；跟 ProTAS/FACT 特征
    urls:
      - https://sid2697.github.io/egoprocel/
      - https://github.com/Sid2697/EgoProceL-egocentric-procedure-learning
  egoprocel_source_videos:
    role: raw
    form: multi_source_videos
    size_gb_est: [100, 250]
    note: 含 EGTEA 等源；仅内网大盘
  assembly101_full:
    role: auxiliary_crossview
    form: multi_view_videos
    size_gb_est: [3890, 3890]
    urls:
      - https://huggingface.co/datasets/cvml-nus/assembly101
      - https://assembly-101.github.io/
    note: 外网机不要全量；最多后期内网下 TSM 特征+标注
  assembly101_features:
    role: auxiliary
    form: tsm_or_dinov2_features
    size_gb_est: [20, 200]
    note: 确切大小以下载页为准；先确认再下
  industreal:
    role: optional
    form: full_or_rgb_only
    size_gb_est: [5, 77]
    urls:
      - https://data.4tu.nl/datasets/b008dd74-020d-4ea4-a8ba-7bb60769d224
      - https://github.com/TimSchoonbeek/IndustReal
    note: all_rgb_videos 约 4.6GB；全包解压约 77GB

third_party:
  ProTAS:
    url: https://github.com/Yuhan-Shen/ProTAS.git
    path: third_party/ProTAS
    goal: A
  EgoPER_official:
    url: https://github.com/robert80203/EgoPER_official.git
    path: third_party/EgoPER
    goal: B

paths:
  public_data: data/public
  features: data/features
  internal_data: data/internal
  outputs: outputs
